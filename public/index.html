<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <main class="page-content">
      <section id="auth" class="card-panel auth-panel">
        <div class="section-header">
          <div>
            <p class="eyebrow">Welcome back</p>
            <h1>Expense Tracker</h1>
          </div>
        </div>
        <form id="loginForm" class="form-stack">
          <label class="input-group">
            <span>Email</span>
            <input type="email" id="loginEmail" placeholder="name@example.com" required />
          </label>
          <label class="input-group">
            <span>Password</span>
            <input type="password" id="loginPassword" placeholder="Enter password" required />
          </label>
          <button class="primary-button" type="submit">Login</button>
        </form>
        <div class="form-footer">
          <p>New to expense tracking?</p>
          <button id="showRegister" class="text-button">Create account</button>
        </div>
      </section>

      <section id="register" class="card-panel auth-panel hidden">
        <div class="section-header">
          <div>
            <p class="eyebrow">Create account</p>
            <h1>Get started</h1>
          </div>
        </div>
        <form id="registerForm" class="form-stack">
          <label class="input-group">
            <span>Username</span>
            <input type="text" id="regUsername" placeholder="Your name" required />
          </label>
          <label class="input-group">
            <span>Email</span>
            <input type="email" id="regEmail" placeholder="name@example.com" required />
          </label>
          <label class="input-group">
            <span>Password</span>
            <input type="password" id="regPassword" placeholder="Create password" required />
          </label>
          <button class="primary-button" type="submit">Register</button>
        </form>
        <div class="form-footer">
          <p>Already have an account?</p>
          <button id="showLogin" class="text-button">Sign in</button>
        </div>
      </section>

      <section id="app" class="app-shell hidden">
        <header class="app-header">
          <div>
            <p class="eyebrow">Dashboard</p>
            <h1>Personal Expenses</h1>
          </div>
          <button id="logout" class="secondary-button">Logout</button>
        </header>

        <div id="notification" class="notification hidden"></div>

        <div class="card-grid">
          <div class="callout-card">
            <p class="card-label">Budget</p>
            <div class="card-value budget-card">
              <span id="budgetValue">₱0</span>
              <button id="editBudgetButton" class="text-button small-button">Set</button>
            </div>
          </div>
          <div class="callout-card">
            <p class="card-label">Monthly Expenses</p>
            <div class="card-value" id="monthlyExpenses">₱0</div>
          </div>
          <div class="callout-card">
            <p class="card-label">Remaining Balance</p>
            <div class="card-value" id="remainingBalance">₱0</div>
          </div>
        </div>

        <section class="database-shell">
          <div class="database-header">
            <div>
              <p class="eyebrow">Transaction List</p>
              <h2>Manage your expenses</h2>
            </div>
            <button id="newTransactionButton" class="new-button">+ New Transaction</button>
          </div>

          <div class="table-wrap">
            <table class="transaction-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Description</th>
                  <th>Category</th>
                  <th>Amount</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="expenseTableBody"></tbody>
            </table>
          </div>

          <div id="transactionFormPanel" class="transaction-panel hidden">
            <form id="expenseForm" class="grid-form">
              <label class="input-group">
                <span>Description</span>
                <input type="text" id="description" placeholder="e.g. Groceries" required />
              </label>
              <label class="input-group">
                <span>Amount</span>
                <input type="number" id="amount" placeholder="0" min="0" required />
              </label>
              <label class="input-group">
                <span>Category</span>
                <select id="category" required>
                  <option value="Food">Food</option>
                  <option value="Bills">Bills</option>
                  <option value="Transport">Transport</option>
                  <option value="Entertainment">Entertainment</option>
                </select>
              </label>
              <div class="form-actions">
                <button type="submit" class="primary-button">Save transaction</button>
                <button type="button" id="cancelTransaction" class="text-button">Cancel</button>
              </div>
            </form>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
